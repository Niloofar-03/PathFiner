<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#DCE4F0}
@keyframes pf-draw{from{stroke-dashoffset:44}to{stroke-dashoffset:0}}
@keyframes pf-pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pf-rise{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pf-logo{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pf-ring{0%{transform:scale(.9);opacity:.35}100%{transform:scale(1.9);opacity:0}}
@keyframes pf-trail{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
.pf-logo{animation:pf-logo .7s cubic-bezier(.2,.8,.2,1) both}
.pf-path{stroke-dasharray:44;animation:pf-draw 1.1s .35s ease-out both}
.pf-dot1{transform-origin:4px 19px;animation:pf-pop .45s .3s ease-out both}
.pf-dot2{transform-origin:20px 7px;animation:pf-pop .45s 1.35s ease-out both}
.pf-ring{animation:pf-ring 2.6s 1.6s ease-out infinite}
.pf-r1{animation:pf-rise .6s 1.1s ease-out both}
.pf-r2{animation:pf-rise .6s 1.3s ease-out both}
.pf-r3{animation:pf-rise .6s 1.6s ease-out both}
.pf-trail{stroke-dasharray:600;animation:pf-trail 3s .2s ease-out both}
@media (prefers-reduced-motion: reduce){.pf-logo,.pf-path,.pf-dot1,.pf-dot2,.pf-ring,.pf-r1,.pf-r2,.pf-r3,.pf-trail{animation:none}}
</style>
</helmet>

      <div class="pf-logo" style="position: relative; width: 104px; height: 104px; border-radius: 30px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 18px 40px rgba(0,0,0,0.25)">
        <svg role="img" aria-label="PathFinder logo" width="58" height="58" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path class="pf-path" d="M4 19c4 0 4-6 8-6s4-6 8-6" stroke="#0B2545" stroke-width="2.2"></path>

          <circle class="pf-dot2" cx="20" cy="7" r="1.9" fill="#0F7A6C"></circle>
        </svg>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center">
      <h1 class="pf-r1" style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 38px; font-weight: 800; letter-spacing: -1px">PathFinder</h1>
      <p class="pf-r2" style="margin: 0; font-size: 16px; line-height: 24px; color: #C9D4E5; max-width: 280px">Find your path. Build the skills, meet the people and land the career you want.</p>
    </div>
  </div>

  <div class="pf-r3" style="position: absolute; left: 24px; right: 24px; bottom: 44px; display: flex; flex-direction: column; gap: 14px; align-items: stretch">
    <a href="Background.dc.html" style="height: 56px; border-radius: 16px; background: #FFFFFF; color: #0B2545; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none">
